[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection-minor-project"
version = "1.0.0"
description = "Machine learning fraud detection implementation inspired by Al-dahasi et al. (2024)."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
